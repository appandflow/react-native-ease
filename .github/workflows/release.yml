name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (leave empty for a dry run)'
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'scripts/check-package.mjs'
      - 'scripts/check-release.mjs'
      - 'tsconfig.build.json'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate release tag
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-release.mjs "$RELEASE_TAG"

      - name: Build package
        run: yarn build

      - name: Pack and inspect
        run: |
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          node scripts/check-package.mjs artifacts/*.tgz

      - name: Preserve verified package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts

      - name: Publish with npm trusted publishing
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          package_name=react-native-ease
          version="${RELEASE_TAG#v}"
          tarball="./artifacts/$package_name-$version.tgz"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi

          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          registry_file="$RUNNER_TEMP/registry.json"
          registry_error="$RUNNER_TEMP/registry-error.txt"

          if npm view "$package_name@$version" version dist.integrity --json > "$registry_file" 2> "$registry_error"; then
            node -e '
              const fs = require("node:fs");
              const [file, version, integrity] = process.argv.slice(1);
              const published = JSON.parse(fs.readFileSync(file, "utf8"));
              if (published.version !== version || published["dist.integrity"] !== integrity) {
                throw new Error("The existing registry version does not match this release tarball.");
              }
            ' "$registry_file" "$version" "$local_integrity"
            echo "$package_name@$version already exists with matching integrity; skipping publish."
            exit 0
          fi

          if ! grep -qE '(^|[^A-Z])E404([^0-9]|$)' "$registry_error"; then
            cat "$registry_error" >&2
            echo "Registry lookup failed with an error other than E404; refusing to publish." >&2
            exit 1
          fi

          npm publish "$tarball" --provenance --access public --tag "$dist_tag"

          for attempt in {1..12}; do
            if npm view "$package_name@$version" version dist.integrity --json > "$registry_file" &&
              npm view "$package_name" "dist-tags.$dist_tag" --json > "$RUNNER_TEMP/dist-tag.json" &&
              node -e '
                const fs = require("node:fs");
                const [releaseFile, tagFile, version, integrity] = process.argv.slice(1);
                const published = JSON.parse(fs.readFileSync(releaseFile, "utf8"));
                const tagged = JSON.parse(fs.readFileSync(tagFile, "utf8"));
                process.exit(
                  published.version === version &&
                  published["dist.integrity"] === integrity &&
                  tagged === version
                    ? 0
                    : 1,
                );
              ' "$registry_file" "$RUNNER_TEMP/dist-tag.json" "$version" "$local_integrity"; then
              exit 0
            fi
            sleep 10
          done

          echo "Registry verification failed." >&2
          exit 1
